<div class="card">
    <p-menubar class="header" [model]="items">
        <ng-template pTemplate="start">
            <img src="assets/imgs/evoli_logo.png" height="40" class="mr-2" />
        </ng-template>

        <div *ngIf="_user.isAuthenticated(); else auth">
            <p-menu #menu [model]="pofileItems" [popup]="true"></p-menu>
            <button pButton type="button" (click)="menu.toggle($event)" icon="pi pi-bars" label="Show"></button>
        </div>
        <ng-template #auth>
            <div class="auth">
                <p-button routerLink="/auth/sign-up"> {{ 'USER.signup' | translate }} </p-button>
                <p-button class="ml-4" styleClass="p-button-warning" routerLink="/auth/sign-in"> {{ 'USER.signin' | translate }} </p-button>
            </div>
        </ng-template>
        
    </p-menubar>
</div>
